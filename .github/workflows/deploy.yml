name: Deploy to S3

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify encrypted portfolio files are present
        run: |
          test -s 599-build-portfolio/index.html
          test -s 599-build-portfolio/payload.bin

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Sync site to S3
        run: |
          aws s3 sync . s3://${{ secrets.S3_BUCKET }} --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "_revamp_backups/*" \
            --exclude ".venv/*" \
            --exclude "backup/*"

      - name: Publish the protected portfolio path and encrypted payload
        env:
          PORTFOLIO_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          aws s3 cp "index.html" "s3://$PORTFOLIO_BUCKET/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --only-show-errors
          aws s3api put-object \
            --bucket "$PORTFOLIO_BUCKET" \
            --key "599-build-portfolio" \
            --body "599-build-portfolio/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store" \
            --no-cli-pager > /dev/null
          aws s3api put-object \
            --bucket "$PORTFOLIO_BUCKET" \
            --key "599-build-portfolio/" \
            --body "599-build-portfolio/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store" \
            --no-cli-pager > /dev/null
          aws s3 cp "599-build-portfolio/index.html" \
            "s3://$PORTFOLIO_BUCKET/599-build-portfolio/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store" \
            --only-show-errors
          aws s3 cp "599-build-portfolio/payload.bin" \
            "s3://$PORTFOLIO_BUCKET/599-build-portfolio/payload.bin" \
            --content-type "application/octet-stream" \
            --cache-control "no-store" \
            --only-show-errors

  refresh_homepage_cache:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure existing AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: Refresh the homepage and favicon edge caches
        env:
          PERSONAL_SITE_DISTRIBUTION_ID: E2TRPE3B2ONSMS
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess

          distribution_id = os.environ["PERSONAL_SITE_DISTRIBUTION_ID"]

          def request(*arguments):
              return subprocess.run(
                  ["aws", "cloudfront", *arguments, "--no-cli-pager"],
                  capture_output=True, text=True)

          def error_code(result):
              match = re.search(r"An error occurred \(([^)]+)\)", result.stderr)
              return match.group(1) if match else "RequestFailed"

          verification = request(
              "get-distribution", "--id", distribution_id,
              "--query", "Distribution.DistributionConfig.Aliases.Items",
              "--output", "json")
          if verification.returncode == 0:
              aliases = json.loads(verification.stdout)
              if "eitandarwish.com" not in (aliases or []):
                  raise SystemExit("Cache refresh stopped: distribution does not serve eitandarwish.com.")
              print("Verified distribution serves eitandarwish.com.")
          elif error_code(verification) in ("AccessDenied", "AccessDeniedException"):
              # This exact ID is recorded in the personal-domain setup. Reading
              # configuration and creating an invalidation are separate permissions.
              print("Distribution read permission unavailable; using the recorded personal-domain ID.")
          else:
              raise SystemExit("Distribution verification failed: " + error_code(verification))

          created = request(
              "create-invalidation", "--distribution-id", distribution_id,
              "--paths", "/", "/index.html", "/favicon.svg",
              "--query", "Invalidation.Id", "--output", "json")
          if created.returncode:
              raise SystemExit("Cache invalidation was not created: " + error_code(created))
          invalidation_id = json.loads(created.stdout)
          print("Created targeted homepage/favicon invalidation " + invalidation_id + ".")

          completed = request(
              "wait", "invalidation-completed", "--distribution-id", distribution_id,
              "--id", invalidation_id)
          if completed.returncode:
              raise SystemExit("Invalidation was created, but completion could not be confirmed: " + error_code(completed))
          print("Homepage/favicon invalidation completed.")
          PY
