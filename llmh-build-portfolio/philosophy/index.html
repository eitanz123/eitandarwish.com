<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="same-origin"><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=8ball1"><title>Eitan Darwish | Build portfolio</title><style>[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:#f6f5f0;color:#172028;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}.gate{min-height:100dvh;display:grid;place-items:center;padding:36px 24px}.card{width:min(100%,440px)}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#294ad9;margin:0 0 27px}h1{font-size:clamp(42px,7vw,58px);line-height:1.04;letter-spacing:-.06em;font-weight:450;margin:0 0 25px}.intro{color:#626b66;line-height:1.7;font-size:15px;margin:0 0 30px}label{display:block;font-size:13px;font-weight:600;margin-bottom:10px}input,button{font:inherit;width:100%;min-height:52px;border-radius:6px;padding:13px 15px}input{background:#fffefa;border:1px solid #c9cbc7;color:#172028;margin-bottom:12px;font-size:16px}button{border:0;background:#294ad9;color:#fff;font-size:14px;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{font-size:12px;color:#858b83;margin-top:30px}.error{color:#9d3125;font-size:13px;line-height:1.5;margin-bottom:12px}iframe{position:fixed;inset:0;border:0;width:100%;height:100dvh;background:#f6f5f0}input:focus-visible,button:focus-visible{outline:3px solid #294ad9;outline-offset:4px}</style></head><body><main class="gate" id="gate"><section class="card" aria-labelledby="gate-title"><p class="eyebrow">Long Lake · Eitan Darwish</p><h1 id="gate-title">Build portfolio</h1><p class="intro">Enter the shared password to view the projects.</p><form id="unlock"><label for="password">Portfolio password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><p id="error" class="error" role="alert" hidden></p><button id="submit">View portfolio</button></form></section></main><script>(function unlockPage(){
  const form=document.querySelector('#unlock'),field=document.querySelector('#password'),button=document.querySelector('#submit'),error=document.querySelector('#error'),gate=document.querySelector('#gate');
  const base='/llmh-build-portfolio';let frame,urls=[],content;
  const bytes=value=>Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  function render(){
    let html=location.pathname.replace(/\/$/,'').endsWith('/philosophy')?content.philosophy:content.html;
    for(const [name,asset] of Object.entries(content.assets))html=html.replaceAll(base+'/media/'+name,asset.url);
    const closeScript='<scr'+'ipt>('+content.interaction+')();</scr'+'ipt>';
    frame.srcdoc='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+content.css+'</style></head><body>'+html+closeScript+'</body></html>';
    document.title=location.pathname.endsWith('/philosophy')?'Eitan Darwish | Applied AI philosophy':'Eitan Darwish | Build portfolio';
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();error.hidden=true;button.disabled=true;button.textContent='Opening…';
    try{
      const response=await fetch(base+'/payload.bin',{cache:'no-store'});if(!response.ok)throw new Error('load');
      const data=new Uint8Array(await response.arrayBuffer());if(new TextDecoder().decode(data.subarray(0,4))!=='PLLM')throw new Error('load');
      const headerLength=new DataView(data.buffer).getUint32(4);const header=JSON.parse(new TextDecoder().decode(data.subarray(8,8+headerLength)));if(header.v!==1||header.iterations!==600000)throw new Error('load');
      const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(field.value),'PBKDF2',false,['deriveKey']);
      const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(header.salt),iterations:header.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
      const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(header.iv),additionalData:new TextEncoder().encode('llmh-build-portfolio:v1')},key,data.subarray(8+headerLength));
      content=JSON.parse(await new Response(new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
      for(const asset of Object.values(content.assets)){asset.url=URL.createObjectURL(new Blob([bytes(asset.base64)],{type:asset.type}));urls.push(asset.url);delete asset.base64;}
      frame=document.createElement('iframe');frame.title='Private build portfolio';render();field.value='';document.body.append(frame);gate.hidden=true;
    }catch(ex){urls.forEach(URL.revokeObjectURL);urls=[];content=undefined;error.textContent=ex.message==='load'?'The portfolio could not load. Please try again.':'That password did not match. Please try again.';error.hidden=false;field.focus();}
    finally{button.disabled=false;button.textContent='View portfolio';}
  });
  addEventListener('message',e=>{if(e.source!==frame?.contentWindow||e.origin!==location.origin)return;
    if(e.data?.type==='portfolio-lock'){frame.remove();frame=undefined;content=undefined;urls.forEach(URL.revokeObjectURL);urls=[];gate.hidden=false;field.focus();}
    if(e.data?.type==='portfolio-section'&&/^#[a-z]+$/.test(e.data.hash))history.replaceState(null,'',location.pathname+e.data.hash);
    if(e.data?.type==='portfolio-page'&&['portfolio','philosophy'].includes(e.data.page)){const hash=/^#[a-z]+$/.test(e.data.hash||'')?e.data.hash:'';history.pushState(null,'',base+(e.data.page==='philosophy'?'/philosophy':'')+hash);render();}
  });
  addEventListener('popstate',()=>{if(content&&frame)render();});
})();</script></body></html>
